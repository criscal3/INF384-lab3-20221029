name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      autorizar_destruccion:
        description: >
          Autorizar acciones de destruccion detectadas en el plan.
          Revisar el plan publicado en el pull request antes de marcar esto en true.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: 1.9.8

jobs:

  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Formato
        run: terraform fmt -check -recursive

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar contra el backend remoto
        run: terraform init -backend-config=backend.hcl

      - name: Validar
        run: terraform validate

  politicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analisis de politicas (Trivy config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '1'

  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar
        run: terraform init -backend-config=backend.hcl

      - name: Calcular plan
        run: terraform plan -out=tfplan

      - name: Exportar plan a JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Subir el plan guardado
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          if-no-files-found: error

      # --- Regla 2: publicar el plan en el PR, en texto legible ---------
      # No detiene. Corre antes de la regla 1 para que el plan quede
      # visible aunque la compuerta siguiente detenga el pipeline.
      - name: Plan en texto legible
        if: github.event_name == 'pull_request'
        id: plan-legible
        run: |
          {
            echo 'resumen<<EOF'
            terraform show -no-color tfplan
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publicar el plan en el pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const resumen = `${{ steps.plan-legible.outputs.resumen }}`;
            const cuerpo = [
              '### Plan de Terraform',
              '',
              '<details><summary>Ver plan completo</summary>',
              '',
              '```hcl',
              resumen,
              '```',
              '',
              '</details>'
            ].join('\n');

            const { data: comentarios } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existente = comentarios.find(c => c.body.startsWith('### Plan de Terraform'));

            if (existente) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existente.id,
                body: cuerpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: cuerpo,
              });
            }

      # --- Regla 1: ninguna accion de destruccion sin autorizacion ------
      # La autorizacion solo puede venir de un workflow_dispatch manual con
      # el input marcado explicitamente en true. Un push o un pull_request
      # nunca la trae, aunque el plan no tenga destrucciones.
      - name: Verificar acciones de destruccion
        run: |
          destrucciones="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' tfplan.json)"

          if [ "$destrucciones" -eq 0 ]; then
            echo "### Comprobacion: destruccion no autorizada — OK" >> "$GITHUB_STEP_SUMMARY"
            echo "El plan no destruye ni reemplaza ningun recurso." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Comprobacion: destruccion no autorizada — HALLAZGO" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "- `\(.address)`: \(.change.actions | join(", "))"' tfplan.json >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.autorizar_destruccion }}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Autorizado manualmente por ${{ github.actor }} via workflow_dispatch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::El plan incluye acciones de destruccion no autorizadas. Revisar el plan publicado y volver a ejecutar el workflow manualmente con 'autorizar_destruccion' en true."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No autorizado: ejecutar el workflow manualmente (workflow_dispatch) con 'autorizar_destruccion' en true, luego de revisar el plan." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar
        run: terraform init -backend-config=backend.hcl

      - name: Descargar el plan guardado
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/

      - name: Aplicar el plan guardado, sin recalcular
        run: terraform apply -auto-approve tfplan
